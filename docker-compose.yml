services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: olympic_dataset
      MYSQL_USER: airflow
      MYSQL_PASSWORD: airflow
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d
      - ./data/athlete_event_results.csv:/var/lib/mysql-files/athlete_event_results.csv
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -proot -e 'SELECT 1 FROM olympic_dataset.athlete_event_results LIMIT 1'"]
      interval: 10s
      retries: 30
      start_period: 60s

  airflow:
    build: .
    command: standalone
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW_CONN_GOIT_MYSQL_DB: mysql://airflow:airflow@mysql:3306/olympic_dataset
    volumes:
      - ./dags:/opt/airflow/dags
    ports:
      - "8080:8080"
